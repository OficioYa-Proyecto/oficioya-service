name: Debug Service
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Read logs and settings
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["AZURE_WEBAPP_PUBLISH_PROFILE"])
          p = root.find(".//publishProfile")
          host = p.get("publishUrl").split(":")[0]
          auth = base64.b64encode((p.get("userName") + ":" + p.get("userPWD")).encode()).decode()
          def get(url):
            try:
              return urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "Basic " + auth}), timeout=60).read().decode("utf-8", "replace")
            except urllib.error.HTTPError as e:
              return "HTTP " + str(e.code) + " " + e.read().decode("utf-8", "replace")[:300]
          print("HOST", host)
          data = json.loads(get("https://" + host + "/api/settings"))
          expected = "ittFuD1AgrBmd01gZC5U1sO+Ube03p4RRhx6mFsSzbxvvgGIvSkHbCgL3vhrlmD4"
          print("JWT_SECRET_MATCH", data.get("JWT_SECRET") == expected)
          for k in ("DB_URL", "USER_SERVICE_URL", "NOTIFICATION_SERVICE_URL", "SPRING_PROFILES_ACTIVE", "WEBSITE_SITE_NAME"):
            print(k, data.get(k, "(unset)"))
          logs = get("https://" + host + "/api/logs?tail=800")
          print("LOGS_LEN", len(logs))
          for line in logs.splitlines():
            low = line.lower()
            if any(k in low for k in ("error", "exception", "caused by", "started oficioya", "failed", "refused")):
              print("LOG", line[:500])
          PY
