name: Debug Service settings
on: workflow_dispatch
jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - name: Read App Settings names
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["AZURE_WEBAPP_PUBLISH_PROFILE"])
          profile = root.find(".//publishProfile")
          host = profile.get("publishUrl").split(":")[0]
          auth = base64.b64encode((profile.get("userName") + ":" + profile.get("userPWD")).encode()).decode()
          url = "https://" + host + "/api/settings"
          req = urllib.request.Request(url, headers={"Authorization": "Basic " + auth})
          data = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace"))
          print("HOST", host)
          print("COUNT", len(data.get("properties", [])), "KEYS", list(data.keys()))
          for item in data.get("properties", []):
              value = item.get("value") or ""
              print(item["name"], "SET" if value.strip() else "(empty)")
          PY
