# Perfil autocontenido para despliegue F1 en Azure (costo cero)
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:file:/home/data/oficioyaservice;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET:oficioya-service-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

notification.service.url=${NOTIFICATION_SERVICE_URL:http://oficioya-notificationapi-apffc2eygzgcbghp.brazilsouth-01.azurewebsites.net}
images.service.url=${IMAGES_SERVICE_URL:https://oficioya-orchestor-api-ghaxfaacfabxh4bv.chilecentral-01.azurewebsites.net}
reputation.service.url=${REPUTATION_SERVICE_URL:https://oficioya-orchestor-api-ghaxfaacfabxh4bv.chilecentral-01.azurewebsites.net}
worker.service.url=${WORKER_SERVICE_URL:http://localhost:8080}
user.service.url=${USER_SERVICE_URL:http://localhost:8080}
service.token=${SERVICE_TOKEN:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
