spring.application.name=oficioya-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8086}

app.jwt.secret=${JWT_SECRET:oficioya-service-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

# Microservicios de usuarios y notificaciones
user.service.url=${USER_SERVICE_URL:https://oficioya-users-api-cmaxb7fphegvdwb3.chilecentral-01.azurewebsites.net}
notification.service.url=${NOTIFICATION_SERVICE_URL:https://oficioya-notificationapi-apffc2eygzgcbghp.brazilsouth-01.azurewebsites.net}

# URLs públicas usadas por los enlaces Aceptar/Rechazar del correo del trabajador.
app.public-url=${SERVICE_PUBLIC_URL:https://ofioya-serviceapi-achydycpa3fgbsch.chilecentral-01.azurewebsites.net}
app.front-url=${FRONT_URL:https://oficioya-front-app-egh6gjc3b0aearhq.chilecentral-01.azurewebsites.net}

logging.file.name=logs/ServicesService.log