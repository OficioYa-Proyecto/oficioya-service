spring.application.name=oficioya-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8086}

app.jwt.secret=${JWT_SECRET:oficioya-service-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

# Microservicio de notificaciones
notification.service.url=${NOTIFICATION_SERVICE_URL:http://oficioya-notificationapi-apffc2eygzgcbghp.westus-01.azurewebsites.net}

logging.file.name=logs/ServicesService.log

image.service.url=${IMAGE_SERVICE_URL:http://localhost:8083}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB